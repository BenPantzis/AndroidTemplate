name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run Detekt
        run: ./gradlew detektAll

      - name: Build debug APK (dev flavor)
        run: ./gradlew assembleDevDebug

      - name: Run unit tests (dev flavor)
        run: ./gradlew testDevDebugUnitTest

      # Verifies screenshot tests against committed golden images.
      # Before this step passes, run `./gradlew recordRoborazziDebug` locally,
      # commit the generated files from src/test/screenshots/, then push.
      - name: Verify screenshot tests
        run: ./gradlew verifyRoborazziDebug

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/build/reports/tests/'

      - name: Upload screenshot diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-diffs
          path: '**/build/outputs/roborazzi/'
